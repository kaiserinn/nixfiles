position = "top"
height = 20

[[start]]
type = "workspaces"
icon_size = 14
sort = "index"
all_monitors = false

[[center]]
type = "clock"
format = "%a %d %b %I:%M %P"
format_popup = "%I:%M:%S %P"

[[end]]
type = "battery"
format = "{percentage}%"
icon_size = 14
show_icon = true
show_label = true

[[end]]
type = "volume"
format = "{icon} {percentage}%"

# Main monitor (eDP-1): slightly bigger scale.
# Per docs/Configuration guide.md and src/main.rs:461-496,
# an entry here replaces the top-level bar for that monitor;
# other monitors keep using the small top-level bar above.
[monitors.eDP-2]
position = "top"
height = 28
name = "main"

[[monitors.eDP-2.start]]
type = "workspaces"
icon_size = 18
sort = "index"
all_monitors = false

[[monitors.eDP-2.center]]
type = "clock"
format = "%a %d %b %I:%M %P"
format_popup = "%I:%M:%S %P"

[[monitors.eDP-2.end]]
type = "battery"
format = "{percentage}%"
icon_size = 18
show_icon = true
show_label = true

[[monitors.eDP-2.end]]
type = "volume"
format = "{icon} {percentage}%"
